[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "macbot"
version = "0.3.2"
description = "LeRobot on a MacBook: one standard workflow to teleoperate, record, export and run LeRobot policies such as ACT, pi0.5 and SmolVLA, with fast inference on Apple silicon."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MuQY1818" }]
keywords = ["robotics", "lerobot", "teleoperation", "imitation-learning", "vla", "pi0", "act", "apple-silicon", "mps", "macos"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
  "lerobot[rebot,dataset,feetech,dynamixel]==0.7.0",
  "numpy",
  "opencv-python",
  "pyyaml",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
orbbec = ["pyorbbecsdk2"]
pi = ["lerobot[pi]==0.7.0"]
mlx = ["lerobot[pi]==0.7.0", "mlx>=0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
sim = ["mujoco==3.3.7"]
dev = ["pytest", "pyflakes", "ruff==0.14.14", "build", "pre-commit"]

[dependency-groups]
# The hardware and model stacks are unnecessary for the default CI suite.
test = ["numpy", "opencv-python-headless", "pyyaml", "pytest"]
lint = ["pyflakes", "ruff==0.14.14"]

[project.urls]
Homepage = "https://github.com/MuQY1818/macbot"
Documentation = "https://github.com/MuQY1818/macbot/blob/main/docs/guide.md"
Issues = "https://github.com/MuQY1818/macbot/issues"
Changelog = "https://github.com/MuQY1818/macbot/releases"

[project.scripts]
macbot = "macbot.cli:main"

[tool.setuptools.packages.find]
include = ["macbot*"]

[tool.setuptools.package-data]
macbot = ["default.yaml", "cameras/swift/*.swift", "web/static/*", "web/static/fonts/*", "web/templates/*.html"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Keep existing line wrapping; use the line length above as a target for new code.
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macbot"
version = "0.1.0"
description = "Real-robot learning on a MacBook: teleoperate, record, export to LeRobot and run ACT / pi0.5 on Apple silicon."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "lerobot[rebot,dataset]==0.7.0",
  "numpy",
  "opencv-python",
  "pyyaml",
]

[project.optional-dependencies]
orbbec = ["pyorbbecsdk2"]
pi = ["lerobot[pi]==0.7.0"]
dev = ["pytest"]

[project.scripts]
macbot = "macbot.cli:main"

[tool.setuptools.packages.find]
include = ["macbot*"]

[tool.setuptools.package-data]
macbot = ["default.yaml", "cameras/swift/*.swift", "web/static/*", "web/static/fonts/*", "web/templates/*.html"]

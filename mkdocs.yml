# Documentation site, built into _site/docs by scripts/build_site.sh and deployed with .github/workflows/pages.yml.
site_name: macbot docs
site_url: https://muqy1818.github.io/macbot/docs/
repo_url: https://github.com/MuQY1818/macbot
repo_name: MuQY1818/macbot
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
  logo: assets/logo-mark.svg
  favicon: assets/logo-mark.svg
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - navigation.top
    - content.code.copy
    - search.highlight
extra_css:
  - assets/macbot.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.keys
  - def_list
  - tables
  - sane_lists
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }
validation:
  links:
    not_found: info
    anchors: warn
    unrecognized_links: info
    absolute_links: info
extra:
  homepage: ../
hooks:
  - scripts/mkdocs_hooks.py
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: macbot 文档
          nav_translations:
            Get started: 开始使用
            Home: 首页
            Quickstart: 快速开始
            Migrate from Linux: 从 Linux 迁移
            Setup: 环境配置
            Use macbot: 使用
            Workflow guide: 工作流程
            Robots: 机械臂
            Policies: 策略
            Acceleration: 加速
            Simulation: 仿真
            Contributing: 参与开发
            Architecture: 架构
            Releasing: 发布
nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Migrate from Linux: migrate.md
      - Setup: setup.md
  - Use macbot:
      - Workflow guide: guide.md
      - Robots: robots.md
      - Policies: policies.md
      - Acceleration: acceleration.md
      - Simulation: simulation.md
  - Contributing:
      - Architecture: architecture.md
      - Releasing: releasing.md

name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade "pip>=25.1"
      - run: python -m pip install --group lint
      - run: python -m ruff check .
      - run: python -m pyflakes macbot tests tools

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Only the optional export integration test needs LeRobot and PyTorch.
      - run: python -m pip install --upgrade "pip>=25.1"
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install --group test
      - run: python -m pytest -q -rs

name: pages

# Builds the website (website/ landing page + MkDocs docs) and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "assets/**", "mkdocs.yml", "scripts/build_site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "mkdocs==1.6.1" "mkdocs-material==9.8.2"
      - run: bash scripts/build_site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

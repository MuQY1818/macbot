name: Hardware test report
description: Share what happened when you ran macbot on a physical robot.
title: "I ran macbot on <robot>"
body:
  - type: markdown
    attributes:
      value: |
        Please share successful and failed runs. Remove personal information, credentials, and local paths from any logs.
  - type: input
    id: version
    attributes:
      label: macbot version or commit
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Hardware and software setup
      description: List the arm, leader, cameras, connection type, macOS version, Apple chip, and memory.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: What worked and what failed
      description: Include the commands and the result for each step you tried (collection, export, policy run, or replay).
    validations:
      required: true
  - type: textarea
    id: bench
    attributes:
      label: Inference latency from macbot bench
      description: Include the command, policy, device, chunk size, median and p90. If you could not run it, include the reason.
      render: text
    validations:
      required: true

<!doctype html>
<html lang="en">
<head>
{{head}}
<title>macbot · replay</title>
</head>
<body>
<header class="topbar">
  {{brand}}
  <span class="crumb"><span data-i18n="replay">replay</span> · {{task}}</span>
  <span id="badge" class="badge idle"></span>
  <span class="spacer"></span>
  <button class="ghost lang" id="lang">中文</button>
</header>

<div class="wrap">
  <p id="replay-status" role="status" hidden></p>
  <div class="layout">
    <div class="stack">
      {{rollout_player}}
    </div>

    <div class="stack">
      <div id="replay-details" hidden>{{rollout_details}}</div>
      <div class="card">
        <h2 data-i18n="rollouts">rollouts</h2>
        <p id="success-rate" class="hint" hidden></p>
        <div class="table-wrap"><table class="rollout-list">
          <thead><tr><th>#</th><th data-i18n="result"></th><th data-i18n="grasp_misses"></th><th data-i18n="length"></th><th></th></tr></thead>
          <tbody id="list"></tbody>
        </table></div>
      </div>
    </div>
  </div>
</div>
<footer>macbot · <span data-i18n="tagline"></span></footer>

<script src="/static/replay.js"></script>
<script>
const list = new RolloutList($("list"), openRollout, { rate: $("success-rate") });
let statusKey;
function showStatus(key) {
  statusKey = key;
  $("replay-status").hidden = !key;
  $("replay-status").textContent = key ? t(key) : "";
}
function badge(meta) {
  const ok = meta.result === "success";
  $("badge").className = "badge " + (meta.exclude ? "idle" : ok ? "live" : "rec");
  $("badge").textContent = t(meta.exclude ? "excluded" : ok ? "success" : "failure");
}
const viewer = new RolloutViewer({
  status: showStatus,
  change: open => {
    $("replay-details").hidden = !open;
    if (open) badge(viewer.data.meta);
  },
  result: (n, value) => { list.updateResult(n, value); badge(value); },
});
function openRollout(n) {
  list.selected = n;
  list.render();
  return viewer.open(n);
}
document.addEventListener("keydown", e => viewer.key(e));
window.onLang = () => {
  list.render();
  viewer.translate();
  showStatus(statusKey);
  if (viewer.data) badge(viewer.data.meta);
};
(async () => {
  try {
    list.items = await list.read();
    list.render();
    if (list.items.length) await openRollout(list.items[0].name);
  } catch (e) {
    showStatus("replay_failed");
  }
})();
</script>
</body>
</html>

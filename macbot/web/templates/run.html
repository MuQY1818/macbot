<!doctype html>
<html lang="en">
<head>
{{head}}
<title>macbot · run</title>
</head>
<body>
<header class="topbar">
  {{brand}}
  <span class="crumb"><span data-i18n="run">run</span> · {{task}}</span>
  <span id="badge" class="badge idle" data-i18n="connecting">connecting</span>
  <span id="timer" class="num"></span>
  <span class="spacer"></span>
  <span class="chip" id="pol"></span>
  <button class="ghost lang" id="lang">中文</button>
  <button class="danger" id="quit" data-i18n="quit">Quit &amp; home</button>
</header>

<div class="wrap">
  <div class="layout">
    <div class="stack">
      <div class="views" id="views"></div>
      <div class="card">
        <div class="btn-row">
          <button class="go" onclick="cmd('start')"><span data-i18n="start">Start</span> <kbd>S</kbd></button>
          <button class="stop" onclick="cmd('pause')"><span data-i18n="hold">Pause</span> <kbd>␣</kbd></button>
          <button onclick="cmd('home')"><span data-i18n="home">Home</span> <kbd>H</kbd></button>
          <span class="spacer"></span>
          <button class="primary" onclick="cmd('save_ok')"><span data-i18n="succ">Success</span> <kbd>Y</kbd></button>
          <button onclick="cmd('save_fail')"><span data-i18n="failb">Failure</span> <kbd>N</kbd></button>
          <button class="ghost" onclick="cmd('discard')" data-i18n="drop">Discard run</button>
        </div>
        <div class="msg" id="msg"></div>
      </div>
      <div class="card">
        <h2><span data-i18n="recent">recent</span> <span class="hint" data-i18n="legend"></span></h2>
        <svg class="plot" id="plot" viewBox="0 0 1000 190" preserveAspectRatio="none"></svg>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <div class="stack">
      <div class="card">
        <h2 data-i18n="status">status</h2>
        <div class="tiles" id="tiles"></div>
        <dl class="kv" style="margin-top:12px">
          <dt data-i18n="executor">executor</dt><dd id="exec"></dd>
          <dt data-i18n="policy">policy</dt><dd id="polp"></dd>
        </dl>
      </div>
      <div class="card">
        <h2><span data-i18n="joints">joints</span> <span class="hint" data-i18n="joints_hint"></span></h2>
        <div id="joints"></div>
      </div>
      <div class="card">
        <h2 data-i18n="trials">trials</h2>
        <div class="table-wrap"><table><tbody id="saved"></tbody></table></div>
      </div>
    </div>
  </div>
</div>
<footer>macbot · <span data-i18n="tagline"></span></footer>

<script>
let S = null, built = false, HQ = [], HC = [];
const HIST = 75;   // samples kept for the trace (~15 s at the 200 ms poll)
const LIM = { shoulder_pan: [-145, 145], shoulder_lift: [-170, 0], elbow_flex: [-200, 0], wrist_flex: [-90, 80],
              wrist_yaw: [-90, 90], wrist_roll: [-90, 90], gripper: [-270, 0] };
async function cmd(a) { render(await post("/api/cmd", { action: a })); }

function build(s) {
  layoutViews($("views"), s.cam_names, c => s.cam_size[c]);
  for (const c of s.cam_names) {
    $("cam-" + c).src = `/stream/${c}.mjpg`;
    $("cam-" + c).onerror = () => setTimeout(() => { $("cam-" + c).src = `/stream/${c}.mjpg?t=${Date.now()}`; }, 1000);
  }
  built = true;
}

function render(s) {
  S = s;
  if (!built) build(s);
  const cls = { running: "run", paused: "warn", homing: "idle" }[s.mode] || "idle";
  $("badge").className = "badge " + cls;
  $("badge").textContent = t(s.mode) + (s.fake ? ` · ${t("simulated")}` : "");
  $("views").classList.toggle("go", s.mode === "running");
  $("timer").textContent = s.rec_s ? `${fmtTime(s.rec_s)}` : "";
  $("msg").textContent = L(s.msg);
  $("pol").textContent = s.policy;
  $("exec").textContent = s.executor;
  $("polp").textContent = s.policy;
  const tile = (k, v, u = "") => `<div class="tile"><div class="k">${t(k)}</div><div class="v">${v}<small> ${u}</small></div></div>`;
  $("tiles").innerHTML = tile("chunks", s.chunks) + tile("infer", s.infer_ms == null ? "–" : Math.round(s.infer_ms), "ms") +
    tile("run_time", s.rec_s, "s") + tile("speed", `×${s.speed}`) + tile("next", `#${String(s.next).padStart(3, "0")}`);
  for (const c of s.cam_names) {
    const a = s.cam_age[c];
    camTag($("tag-" + c), c, a, s.stall_s);
    $("age-" + c).textContent = a == null ? "" : `${Math.round(a * 1000)} ms`;
  }
  renderJoints($("joints"), s.names, s.q, s.cmd, LIM);
  if (s.mode === "running") { HQ.push(s.q); HC.push(s.cmd); if (HQ.length > HIST) { HQ.shift(); HC.shift(); } }
  if (HQ.length > 1) { drawTraces($("plot"), $("legend"), HQ, HC, s.names.slice(0, 6)); $("legend").lastElementChild.remove(); moveCursor($("plot"), HQ.length - 1, HQ.length); }
  $("saved").innerHTML = s.saved.length ? s.saved.slice().reverse().map(r =>
    `<tr><td class="num">${r.name}</td><td><span class="pill ${r.result === "success" ? "ok" : "bad"}">${t(r.result)}</span></td><td class="num">${r.s} s</td></tr>`).join("")
    : `<tr><td class="empty">${t("no_trials")}</td></tr>`;
}

$("quit").onclick = () => { if (confirm(t("confirm_quit"))) cmd("quit"); };
document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName) || e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === "s") cmd("start"); else if (k === " ") { e.preventDefault(); cmd("pause"); }
  else if (k === "h") cmd("home"); else if (k === "y") cmd("save_ok"); else if (k === "n") cmd("save_fail");
});
window.onLang = () => { if (S) { for (const c of S.cam_names) $("tag-" + c).textContent = camLabel(c); render(S); } };
async function poll() {
  try { render(await (await fetch("/api/status")).json()); }
  catch (e) { $("badge").className = "badge idle"; $("badge").textContent = t("disconnected"); }
  setTimeout(poll, 200);
}
poll();
</script>
</body>
</html>

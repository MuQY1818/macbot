<!doctype html>
<html lang="en">
<head>
{{head}}
<title>macbot · run</title>
</head>
<body>
<header class="topbar">
  {{brand}}
  <span class="crumb"><span data-i18n="run">run</span> · {{task}}</span>
  <span id="badge" class="badge idle" data-i18n="connecting">connecting</span>
  <span id="timer" class="num"></span>
  <span class="spacer"></span>
  <span class="chip" id="pol"></span>
  <button class="ghost lang" id="lang">中文</button>
  <button class="danger" id="quit" data-i18n="quit">Quit &amp; home</button>
</header>

<div class="wrap">
  <div class="layout">
    <div class="stack">
      <div class="views" id="views"></div>
      <div class="card">
        <div class="btn-row">
          <button class="go" id="bStart" onclick="cmd('start')"><span data-i18n="start">Start</span> <kbd>S</kbd></button>
          <button class="stop" onclick="cmd('pause')"><span data-i18n="hold">Pause</span> <kbd>␣</kbd></button>
          <button id="bHome" onclick="cmd('home')"><span id="home-label" data-i18n="home">Home</span> <kbd>H</kbd></button>
          <span class="spacer"></span>
          <button class="primary" onclick="cmd('save_ok')"><span data-i18n="succ">Success</span> <kbd>Y</kbd></button>
          <button onclick="cmd('save_fail')"><span data-i18n="failb">Failure</span> <kbd>N</kbd></button>
          <button class="ghost" onclick="cmd('discard')" data-i18n="drop">Discard run</button>
        </div>
        <div class="btn-row run-interventions">
          <button id="takeover" onclick="cmd('takeover')" hidden><span data-i18n="takeover">Take over</span> <kbd>T</kbd></button>
          <button id="mark-hand" class="ghost" onclick="cmd('mark_hand')" disabled><span data-i18n="mark_hand">Mark hand in scene</span> <kbd>M</kbd></button>
          <span class="hint" id="hand-count" role="status"></span>
        </div>
        <div class="msg" id="msg"></div>
      </div>
      <section class="stack" id="run-replay" tabindex="-1" hidden>
        {{rollout_player}}
      </section>
      <div class="card" id="live-trace">
        <h2><span data-i18n="recent">recent</span> <span class="hint" data-i18n="legend"></span></h2>
        <svg class="plot" id="plot" viewBox="0 0 1000 190" preserveAspectRatio="none"></svg>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <div class="stack">
      <div class="card">
        <h2 data-i18n="status">status</h2>
        <div class="tiles" id="tiles"></div>
        <dl class="kv" style="margin-top:12px">
          <dt data-i18n="executor">executor</dt><dd id="exec"></dd>
          <dt data-i18n="policy">policy</dt><dd id="polp"></dd>
        </dl>
      </div>
      <div class="card">
        <h2><span id="joints-title" data-i18n="joints">joints</span> <span class="hint" data-i18n="joints_hint"></span></h2>
        <div id="joints"></div>
        <div id="leader-alignment" hidden>
          <div class="alignment-heading"><strong data-i18n="leader_delta">Leader − follower</strong><span id="align-limit" class="hint"></span></div>
          <div id="alignment-values"></div>
        </div>
      </div>
      <div class="card">
        <h2 data-i18n="saved_trials">Saved trials</h2>
        <p id="success-rate" class="hint" hidden></p>
        <p id="run-replay-msg" role="status" hidden></p>
        <div class="table-wrap"><table class="rollout-list">
          <thead><tr><th>#</th><th data-i18n="result"></th><th data-i18n="grasp_misses"></th><th data-i18n="length"></th><th data-i18n="th_saved"></th></tr></thead>
          <tbody id="saved"></tbody>
        </table></div>
        <button class="ghost rollout-toggle" id="all-trials" aria-controls="saved" hidden></button>
      </div>
      <section id="run-review" aria-labelledby="rinfo-title" hidden>{{rollout_details}}</section>
    </div>
  </div>
</div>
<footer>macbot · <span data-i18n="tagline"></span></footer>

<script src="/static/replay.js"></script>
<script>
let S = null, built = false, HQ = [], HC = [];
const HIST = 75;   // samples kept for the trace (~15 s at the 200 ms poll)
const panel = $("run-replay"), blocking = new Set(["start", "home", "quit"]);
let motion = 0, indexLoad, indexRevision, indexError, viewerMessage, nextIndexTry = 0;
const saved = new RolloutList($("saved"), n => {
  saved.selected = n;
  saved.render();
  viewer.open(n);
}, { toggle: $("all-trials"), timed: true, rate: $("success-rate") });
saved.enabled = false;
const viewer = new RolloutViewer({
  trialHeading: true,
  status: key => { viewerMessage = key; replayMessage(); },
  change: open => {
    if (panel.hidden === !open) return;
    panel.hidden = $("run-review").hidden = !open;
    const jointsTitle = $("joints-title");
    jointsTitle.dataset.i18n = open ? "live_joints" : "joints";
    jointsTitle.textContent = t(jointsTitle.dataset.i18n);
    $("views").hidden = $("live-trace").hidden = open;
    for (const c of S.cam_names) {
      const img = $("cam-" + c);
      if (open) img.removeAttribute("src");
      else img.src = `/stream/${c}.mjpg?t=${Date.now()}`;
    }
    if (open) panel.focus({ preventScroll: true });
  },
  result: (n, value) => saved.updateResult(n, value),
});
function replayMessage() {
  const key = !saved.enabled ? (S ? "pause_first" : null) : viewerMessage || indexError;
  $("run-replay-msg").hidden = !key;
  $("run-replay-msg").textContent = key ? t(key) : "";
}
function enableReplay(enabled) {
  if (!enabled && saved.enabled) {
    viewer.close();
    viewerMessage = null;
    saved.selected = null;
    indexLoad?.abort();
    indexLoad = null;
    indexRevision = null;
  }
  saved.enabled = enabled;
  saved.render();
  replayMessage();
}
async function readSaved(revision) {
  const load = indexLoad = new AbortController();
  try {
    const items = await saved.read(load.signal);
    if (load.signal.aborted) return;
    saved.items = items;
    indexRevision = revision;
    indexError = null;
    saved.render();
  } catch (e) {
    if (load.signal.aborted) return;
    indexError = e.message in I18N.en ? e.message : "replay_failed";
    nextIndexTry = Date.now() + 1000;
  } finally {
    if (!load.signal.aborted) { indexLoad = null; replayMessage(); }
  }
}
async function cmd(a) {
  const moves = blocking.has(a);
  if (moves) { motion++; enableReplay(false); }
  let s;
  try {
    s = await post("/api/cmd", { action: a });
  } finally {
    if (moves) motion--;
  }
  render(s);
}

function build(s) {
  layoutViews($("views"), s.cam_names, c => s.cam_size[c]);
  for (const c of s.cam_names) {
    $("cam-" + c).src = `/stream/${c}.mjpg`;
    $("cam-" + c).onerror = () => setTimeout(() => {
      if (panel.hidden) $("cam-" + c).src = `/stream/${c}.mjpg?t=${Date.now()}`;
    }, 1000);
  }
  built = true;
}

function render(s) {
  S = s;
  if (!built) build(s);
  $("quit").dataset.i18n = s.sim || s.motor_health?.tripped ? "quit_sim" : "quit";
  $("quit").textContent = t($("quit").dataset.i18n);
  $("home-label").dataset.i18n = s.sim ? "reset_scene" : "home";
  $("home-label").textContent = t($("home-label").dataset.i18n);
  const manual = ["aligning", "following"].includes(s.mode);
  const tripped = s.motor_health?.tripped;
  const cls = tripped ? "alarm" : ({ running: "run", paused: "warn", homing: "idle", aligning: "warn", following: "run" }[s.mode] || "idle");
  $("badge").className = "badge " + cls;
  $("badge").dataset.runMode = s.mode;
  $("badge").textContent = t(tripped ? "motor_alarm" : s.mode) + (s.sim || s.fake ? ` · ${t("simulated")}` : "");
  $("views").classList.toggle("go", s.mode === "running" || s.mode === "following");
  $("timer").textContent = s.rec_s ? `${fmtTime(s.rec_s)}` : "";
  $("msg").textContent = L(s.msg);
  $("bStart").disabled = !!s.motor_health?.blocked;
  $("bHome").disabled = !!s.motor_health?.tripped;
  const takeover = $("takeover");
  takeover.hidden = !s.takeover_enabled;
  takeover.disabled = tripped || (manual ? !!s.motor_health?.blocked : s.mode !== "running");
  takeover.firstElementChild.dataset.i18n = manual ? "return_policy" : "takeover";
  takeover.firstElementChild.textContent = t(takeover.firstElementChild.dataset.i18n);
  $("mark-hand").disabled = !s.recording;
  $("hand-count").textContent = s.hand_marks ? t("hand_marked", s.hand_marks) : "";
  $("leader-alignment").hidden = !manual;
  if (manual) {
    $("align-limit").textContent = t("align_target", s.align_deg);
    const entries = Object.entries(s.alignment || {});
    const grip = s.gripper_alignment;
    const angle = d => `${d > 0 ? "+" : ""}${d.toFixed(1)}°`;
    const arms = entries.map(([name, d]) =>
      `<div><span>${esc(jointLabel(name))}</span><strong class="num ${Math.abs(d) <= s.align_deg ? "aligned" : "outside"}">` +
      `${angle(d)}</strong></div>`).join("");
    const gripState = grip ? (grip.leader ? `${t("grip_" + grip.leader)} / ${t("grip_" + grip.follower)}`
      : `${angle(grip.delta)} / ±${grip.tolerance}°`) : "";
    const gripHint = grip && !grip.ready && s.mode === "aligning" ? (grip.follower
      ? t(grip.follower === "closed" ? "grip_close_leader" : "grip_open_leader")
      : t("grip_match_leader", grip.tolerance)) : "";
    const gripper = grip ? `<div class="grip-alignment"><span>${esc(jointLabel(s.gripper))}</span>` +
      `<strong class="${s.mode === "aligning" ? (grip.ready ? "aligned" : "outside") : ""}">${esc(gripState)}</strong></div>` +
      (gripHint ? `<p class="hint grip-alignment-hint outside" role="status">${esc(gripHint)}</p>` : "") : "";
    $("alignment-values").innerHTML = arms + gripper || `<span class="hint">${t("leader_missing")}</span>`;
  }
  $("pol").textContent = s.policy;
  $("exec").textContent = s.executor;
  $("polp").textContent = s.policy;
  const tile = (k, v, u = "") => `<div class="tile"><div class="k">${t(k)}</div><div class="v">${v}<small> ${u}</small></div></div>`;
  $("tiles").innerHTML = tile("chunks", s.chunks) + tile("infer", s.infer_ms == null ? "–" : Math.round(s.infer_ms), "ms") +
    tile("run_time", s.rec_s, "s") + tile("speed", `×${s.speed}`) + tile("next", `#${String(s.next).padStart(3, "0")}`);
  for (const c of s.cam_names) {
    const a = s.cam_age[c];
    const still = s.sim && s.mode === "paused" && a != null;
    camTag($("tag-" + c), c, still ? 0 : a, s.stall_s);
    $("age-" + c).textContent = still ? t("render_hold") : (a == null ? "" : `${Math.round(a * 1000)} ms`);
  }
  renderJoints($("joints"), s.names, s.q, s.cmd, s.limits, s.motor_health);
  if (s.mode === "running" || manual) { HQ.push(s.q); HC.push(s.cmd); if (HQ.length > HIST) { HQ.shift(); HC.shift(); } }
  if (HQ.length > 1) { drawTraces($("plot"), $("legend"), HQ.map(r => r.slice(0, -1)), HC.map(r => r.slice(0, -1)), s.names.slice(0, -1)); $("legend").lastElementChild.remove(); moveCursor($("plot"), HQ.length - 1, HQ.length); }
  enableReplay(s.replay_ready && !motion);
  if (saved.enabled && s.saved_revision !== indexRevision && !indexLoad && Date.now() >= nextIndexTry) readSaved(s.saved_revision);
}

$("rclose").hidden = false;
$("rclose").onclick = () => {
  const previous = saved.selected;
  viewer.close();
  viewerMessage = saved.selected = null;
  saved.render();
  replayMessage();
  if (previous) $("saved").querySelector(`[data-n="${CSS.escape(previous)}"] button`)?.focus();
};
$("quit").onclick = () => { if (confirm(t(S?.motor_health?.tripped ? "confirm_quit_alarm" : "confirm_quit"))) cmd("quit"); };
document.addEventListener("keydown", e => {
  if ($("run-review").contains(e.target) || (panel.contains(e.target) && (e.repeat || viewer.key(e) || isEditing(e)))) return;
  if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName) || e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === "s") cmd("start"); else if (k === " ") { e.preventDefault(); cmd("pause"); }
  else if (k === "h") cmd("home"); else if (k === "y") cmd("save_ok"); else if (k === "n") cmd("save_fail");
  else if (k === "t" && !$("takeover").disabled && !$("takeover").hidden) cmd("takeover");
  else if (k === "m" && !$("mark-hand").disabled) cmd("mark_hand");
});
window.onLang = () => { if (S) render(S); viewer.translate(); };
async function poll() {
  try { render(await pollStatus()); }
  catch (e) { enableReplay(false); $("badge").className = "badge idle"; $("badge").textContent = t("disconnected"); }
  setTimeout(poll, 200);
}
poll();
</script>
</body>
</html>
